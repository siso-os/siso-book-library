name: Book Library integrity

on:
  pull_request:
    paths:
      - "scripts/**"
      - "index/**"
      - "tests/**"
      - "manifests/**"
      - "docs/**"
      - ".github/workflows/book-library-integrity.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "index/**"
      - "tests/**"
      - "manifests/**"
      - ".github/workflows/book-library-integrity.yml"

permissions:
  contents: read

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q scripts tests
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -v
      - name: Run full fixture pipeline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/run_fixture_pipeline.py
